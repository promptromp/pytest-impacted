# Runs only tests impacted by the PR's changes (dogfoods pytest-impacted).
# Lint runs once per pull request, in ci.yml.

name: CI (impacted)

permissions:
  contents: read

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        backend: ["python", "fast"]

    name: test (${{ matrix.python-version }}, ${{ matrix.backend }})
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install uv and set the python version
      id: setup-uv
      # Downloading uv sometimes fails with a transient "fetch failed"; retried once below.
      continue-on-error: true
      uses: astral-sh/setup-uv@v10.4.0
      with:
        python-version: ${{ matrix.python-version }}
        version: "latest"
        enable-cache: true
    - name: Wait before retrying the uv install
      if: steps.setup-uv.outcome == 'failure'
      run: sleep 20
    - name: Install uv and set the python version (retry)
      if: steps.setup-uv.outcome == 'failure'
      uses: astral-sh/setup-uv@v10.4.0
      with:
        python-version: ${{ matrix.python-version }}
        version: "latest"
        enable-cache: true
    - name: Install the project (python backend)
      if: matrix.backend == 'python'
      run: uv sync --dev
    - name: Install the project (fast/Rust backend)
      if: matrix.backend == 'fast'
      run: uv sync --all-extras --dev
    - name: Run impacted tests
      id: impacted
      run: >
        uv run pytest
        --impacted
        --impacted-module pytest_impacted
        --impacted-git-mode branch
        --impacted-base-branch origin/${{ github.base_ref }}
        --impacted-tests-dir tests
    # Again under pytest-xdist, as many run it: there the controller analyses and the workers filter.
    # Also when the serial run failed, so a failure shows on both paths or on one.
    - name: Run impacted tests under pytest-xdist
      if: ${{ !cancelled() && (steps.impacted.outcome == 'success' || steps.impacted.outcome == 'failure') }}
      # The module and tests dir come from pyproject.toml here, as the pre-commit hook takes them: the ini path.
      run: >
        uv run pytest
        --impacted
        --impacted-git-mode branch
        --impacted-base-branch origin/${{ github.base_ref }}
        -n auto

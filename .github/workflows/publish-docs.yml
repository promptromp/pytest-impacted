name: Publish docs

on:
  push:
    branches:
      - main
      - docs/**

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure Git Credentials
        run: |
            git config --global user.name "${GITHUB_ACTOR}"
            git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> "${GITHUB_ENV}"
      - uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      # Pinned: an unpinned theme release could change or break the site unseen.
      - run: pip install mkdocs-material==9.8.2 markdown-callouts==0.4.0
      - name: copy README.md to docs/
        run: |
          cp README.md docs/
      # --strict: a broken link or a missing page fails the deploy instead of publishing it.
      - run: mkdocs gh-deploy --force --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

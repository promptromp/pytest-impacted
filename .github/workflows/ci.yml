# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: "3.13"
        version: "latest"
        enable-cache: true
    - name: Install the project
      run: uv sync --all-extras --dev
    - name: Cache pre-commit hook environments
      uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
    # Runs the full .pre-commit-config.yaml (ruff, mypy, cargo fmt/clippy, and
    # the hygiene hooks) so CI enforces exactly what pre-commit does locally and
    # a `git commit --no-verify` cannot slip past it. pytest is skipped here
    # because the test matrix below covers it across every Python version.
    - name: Run pre-commit hooks
      run: uv run pre-commit run --all-files --show-diff-on-failure
      env:
        SKIP: pytest

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        backend: ["python", "fast"]

    name: test (${{ matrix.python-version }}, ${{ matrix.backend }})
    steps:
    - uses: actions/checkout@v7
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v9.0.0
      with:
        python-version: ${{ matrix.python-version }}
        version: "latest"
        enable-cache: true
    - name: Install the project (python backend)
      if: matrix.backend == 'python'
      run: uv sync --dev
    - name: Install the project (fast/Rust backend)
      if: matrix.backend == 'fast'
      run: uv sync --all-extras --dev
    - name: Run tests
      run: uv run pytest

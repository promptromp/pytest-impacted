fail_fast: true
repos:
-   repo: local
    hooks:
    # do not allow commits with files containing certain blacklisted strings
    -   id: dontship
        name: detect blacklisted strings
        exclude: ^.pre-commit-config.yaml
        entry: codeartifact
        language: pygrep
        types: [text]
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-added-large-files
      args: [ --maxkb=1000 ]
    - id: fix-byte-order-marker
    - id: check-case-conflict
    - id: check-json
    - id: check-toml
    - id: check-yaml
      args: [ --unsafe ]
    - id: check-merge-conflict
    - id: check-shebang-scripts-are-executable
    - id: mixed-line-ending
      args: [ --fix=lf ]
    - id: detect-aws-credentials
      args: [ --allow-missing-credentials ]
    - id: detect-private-key
    - id: end-of-file-fixer
    - id: trailing-whitespace
# Keeps uv.lock in sync with pyproject.toml, so a dependency edit cannot be
# committed without the corresponding lockfile update.
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.11.32
  hooks:
    - id: uv-lock
- repo: local
  hooks:
  # Ruff, mypy and pytest all run out of the dev dependency group resolved in
  # uv.lock. That is deliberate: CI runs `uv run ruff check` / `uv run mypy`,
  # so sourcing the same binaries here makes it structurally impossible for the
  # pre-commit and CI versions to drift apart. (They previously did: the
  # ruff-pre-commit rev sat at v0.15.13 while uv.lock resolved ruff 0.15.16.)
  # Bump ruff/mypy via `uv lock --upgrade` — there is no separate rev to update.
  - id: ruff-check
    name: ruff check
    entry: uv run ruff check --force-exclude --fix
    language: system
    types_or: [python, pyi]
    require_serial: true
  - id: ruff-format
    name: ruff format
    entry: uv run ruff format --force-exclude
    language: system
    types_or: [python, pyi, markdown]
    require_serial: true
  - id: mypy
    name: mypy
    entry: bash -ec "uv run mypy pytest_impacted"
    language: system
    types: [python]
    pass_filenames: false
  - id: cargo-fmt
    name: cargo fmt (rust)
    entry: cargo fmt --manifest-path rust/Cargo.toml --
    language: system
    types: [rust]
    pass_filenames: false
  - id: cargo-clippy
    name: cargo clippy (rust)
    entry: bash -ec "cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings"
    language: system
    types: [rust]
    pass_filenames: false
  - id: pytest
    name: pytest [with coverage, without slow]
    entry: bash -ec "uv run python -m pytest --cov=pytest_impacted --cov-branch tests -m 'not slow'"
    language: system
    types: [python]
    pass_filenames: false
